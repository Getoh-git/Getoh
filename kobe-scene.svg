<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" preserveAspectRatio="xMidYMax meet" role="img" aria-label="ภาพโกเบ หอคอยโกเบพอร์ตทาวเวอร์">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C9DC" stop-opacity="0"/><stop offset=".55" stop-color="#B9C9DC" stop-opacity=".55"/><stop offset="1" stop-color="#B9C9DC" stop-opacity=".9"/></linearGradient>
