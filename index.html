<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osaka Trip 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#f8fafc;--mut:#94a3b8;--sky:#38bdf8;--grn:#34d399;--amb:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0f172a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Sarabun',system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px}
h1{font-size:24px;margin:8px 0 2px;line-height:1.25}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.hide{display:none!important}
/* countdown */
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.timer div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 0;text-align:center}
.timer b{display:block;font-size:30px;line-height:1.1}
.timer span{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats .card b{display:block;font-size:18px}.stats .card span{font-size:13px;color:var(--mut)}
.dist{display:grid;gap:8px;margin-top:12px}.dist .card{font-size:14px;padding:12px}.dist strong{display:block;color:var(--sky)}
input[type=date]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
.btn{min-height:48px;border:0;border-radius:14px;padding:0 16px;font-weight:700;background:var(--sky);color:#082f49;width:100%;cursor:pointer}
.btn.g{background:var(--grn);color:#022c22}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--line)}
/* filters */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.bar input[type=search]{width:100%;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;cursor:pointer}
.chip.on{background:var(--sky);color:#082f49;border-color:var(--sky);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.row2 select{min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:14px;width:100%}
.count{font-size:13px;color:var(--mut);margin:10px 0 6px}
/* hotel list */
.h{display:flex;gap:12px;align-items:stretch;margin-bottom:10px;padding:12px;cursor:pointer}
.h.sel{border-color:var(--sky);box-shadow:0 0 0 2px rgba(56,189,248,.25)}
.sc{flex:none;width:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px}
.sc small{font-size:11px;font-weight:400;opacity:.85}
.hb{flex:1;min-width:0}
.hb h3{margin:0;font-size:16px;line-height:1.3}
.tag{font-size:13px;color:var(--sky)}
.meta{display:flex;justify-content:space-between;align-items:end;margin-top:6px;font-size:14px;color:var(--mut)}
.pr{color:var(--grn);font-weight:700;font-size:18px}
.pick{flex:none;align-self:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:20px;cursor:pointer}
.sel .pick{background:var(--sky);border-color:var(--sky);color:#082f49}
/* nav + action bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr;background:#020617;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{min-height:58px;background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer}
nav button.on{color:var(--sky);font-weight:700}nav button span{display:block;font-size:20px}
#act{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:30;background:#020617;border:1px solid var(--sky);border-radius:16px;padding:8px;display:flex;gap:8px;align-items:center}
#act .btn{min-height:46px;font-size:14px}
#act em{font-style:normal;font-size:14px;padding:0 6px;white-space:nowrap}
/* bottom sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sheet h2{margin:0;font-size:18px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:18px;cursor:pointer}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span{color:var(--mut)}
.cmp{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.cmp.best{border-color:var(--grn)}
.cmp h3{margin:0 0 4px;font-size:16px}
.cmp .kv{padding:5px 0;font-size:14px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:#fff;color:#0f172a;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60}
@media(min-width:720px){body{font-size:17px}.timer b{font-size:44px}}
.fc{background:#0e0f11;border:1px solid #26272b;border-radius:22px;padding:16px;margin-top:12px;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.fh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#6b6b70;margin-bottom:12px}
.fr{display:flex;align-items:flex-start;gap:10px}.fr>div{flex:1;min-width:0}.fr svg{height:36px;width:auto;display:block;margin-bottom:8px}
.ar{flex:none!important;color:#ff7a00;font-size:22px;line-height:36px}
.fr b{display:block;font-size:17px}.fr small,.fe small{display:block;font-size:12px;color:#6b6b70;letter-spacing:.03em}
.fe{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;background:#17181b;border-radius:12px}
.fe b{font-size:16px}.or{color:#ff7a00;font-weight:700;font-size:13px;text-align:right}
.ft{display:flex;align-items:center;gap:8px;margin-top:10px}.ft svg{flex:1;min-width:0}.ft code{font:13px ui-monospace,Menlo,monospace;color:#8a8a90;white-space:nowrap}
.fa{font-size:12px;color:#8a8a90;margin-top:8px}.fa b{color:#fff}
.rc{font-size:12px;color:var(--mut);margin-top:2px}
.rvh{margin:16px 0 6px;font-weight:700}
.rv{border-left:4px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.rv.p{border-color:var(--grn)}.rv.n{border-color:#f87171}.rv.m{border-color:var(--amb)}
.rv small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.fm label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
.fm input,.fm textarea{display:block;width:100%;margin-top:4px;min-height:46px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.phg.note{display:block}.phg .btn{grid-column:1/-1}
.phi{position:relative}
.phi img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--bg);cursor:zoom-in}
.phx{position:absolute;top:6px;right:6px;min-width:36px;height:36px;border-radius:18px;border:0;background:rgba(2,6,23,.78);color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>


<section id="p-count" class="wrap">
  <h1>🇯🇵 เตรียมพร้อมสู่โอซาก้า 2026</h1>
  <p class="sub">นับถอยหลังและไฟลท์บิน</p>
  <div class="card">
    <div class="sub" style="margin:0" id="tlabel">เวลาที่เหลือจนถึงวันเดินทาง</div>
    <div class="timer">
      <div><b id="td">00</b><span>วัน</span></div>
      <div><b id="th">00</b><span>ชม.</span></div>
      <div><b id="tm">00</b><span>นาที</span></div>
      <div><b id="ts" style="color:var(--sky)">00</b><span>วินาที</span></div>
    </div>
    <div class="sub" id="tnext" style="text-align:center;margin:0"></div>
    <button class="btn" style="margin-top:12px" onclick="tab('hotels')">🏨 เลือกโรงแรม ➔</button>
  </div>
  <h3 style="margin:18px 0 0">✈️ ไฟลท์บิน</h3>
  <div id="flights"></div>

</section>

<section id="p-hotels" class="hide">
  
  <div class="bar">
    <input type="search" id="q" placeholder="🔍 ค้นหาชื่อโรงแรม..." oninput="draw()">
    <div class="chips" id="chips"></div>
    <div class="row2">
      <select id="size" onchange="draw()">
        <option value="0">ทุกขนาดห้อง</option>
        <option value="15">15 m² ขึ้นไป</option>
        <option value="20">20 m² ขึ้นไป</option>
        <option value="25">25 m² ขึ้นไป</option>
      </select>
      <select id="sort" onchange="draw()">
        <option value="id">ลำดับเดิม</option>
        <option value="pa">ราคา ต่ำ ➔ สูง</option>
        <option value="pd">ราคา สูง ➔ ต่ำ</option>
        <option value="sz">ห้องใหญ่ก่อน</option>
        <option value="sc">คะแนนสูงก่อน</option>
      </select>
    </div>
    <div class="row2" style="margin-top:8px">
      <button class="btn" style="min-height:44px;font-size:14px" onclick="openForm()">➕ เพิ่มที่พัก</button>
      <button class="btn o" style="min-height:44px;font-size:14px" onclick="manage()">⚙️ ข้อมูล</button>
    </div>
  </div>
  <div class="wrap" style="padding-top:0">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>
</section>

<div id="act" class="hide">
  <em>เลือก <b id="n">0</b></em>
  <button class="btn" onclick="compare()">📊 เปรียบเทียบ</button>
  <button class="btn g" onclick="copyLine()">💬 LINE</button>
  <button class="x" onclick="sel=[];draw()" aria-label="ล้าง">✕</button>
</div>


<nav>
  <button id="n-count" class="on" onclick="tab('count')"><span>⏳</span>นับถอยหลัง</button>
  <button id="n-hotels" onclick="tab('hotels')"><span>🏨</span>เลือกโรงแรม (18)</button>
</nav>

<div id="ov" class="ov hide" onclick="if(event.target===this)closeSheet()">
  <div class="sheet"><header><h2 id="st"></h2><button class="x" onclick="closeSheet()" aria-label="ปิด">✕</button></header><div id="sb"></div></div>
</div>

<script src="hotels.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
